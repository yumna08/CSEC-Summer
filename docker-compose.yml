services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusguide}
      POSTGRES_USER: ${POSTGRES_USER:-campusguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADMIN_API_KEY: ${ADMIN_API_KEY-}
      REQUIRE_ADMIN_AUTH: ${REQUIRE_ADMIN_AUTH:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-flash-latest,gemini-flash-lite-latest}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campusguide}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campusguide}
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      USE_GRAPH_PIPELINE: ${USE_GRAPH_PIPELINE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-60/minute}
      ADMIN_RATE_LIMIT: ${ADMIN_RATE_LIMIT:-10/minute}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-6}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
